<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cone">
<meta name="theme-color" content="#171716">
<title>Cone</title>
<style>
:root{--bg:#f2f2f0;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#d9d9d4;--accent:#e8740c}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--panel:#222220;--ink:#f0efe9;--mute:#9a9992;--line:#34342f;--accent:#ff8a1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:5}
header h1{margin:0;font-size:18px;flex:1}
main{padding:14px;max-width:900px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
button:disabled{opacity:.5}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.form{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:30px auto}
.mute{color:var(--mute);font-size:14px}
.err{color:#c0392b;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;padding:0;text-align:left;min-height:0}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--line)}
.card span{display:block;padding:6px 8px;font-size:13px;line-height:1.25;height:3.3em;overflow:hidden}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{text-align:left;display:block;width:100%}
.item small{display:block;color:var(--mute);margin-top:2px;white-space:normal}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
video{width:100%;max-height:70vh;background:#000;border-radius:8px;margin-top:12px}
h2{font-size:18px;margin:6px 0}
</style>
</head>
<body>
<header><button id="back" hidden aria-label="Back">←</button><h1>Cone</h1><button id="out" hidden>Sign out</button></header>
<main id="m"></main>
<script>
const API='https://api.strem.io/api/', CINE='https://v3-cinemeta.strem.io';
const m=document.getElementById('m'), backBtn=document.getElementById('back'), outBtn=document.getElementById('out');
const S={key:localStorage.getItem('authKey')||'',lib:[],addons:[],stack:[]};

const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x==='on')for(const[ev,f]of Object.entries(y))e.addEventListener(ev,f);else if(x in e&&x!=='list')e[x]=y;else e.setAttribute(x,y)}
  k.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c)));return e};
const api=async(method,body)=>{const r=await fetch(API+method,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(j.error)throw new Error(j.error.message||'Request failed');return j.result};
const getJSON=async(url,ms=9000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}};

function show(view,{push=true}={}){if(push&&m.firstChild)S.stack.push([...m.childNodes]);m.replaceChildren(...[].concat(view));
  backBtn.hidden=!S.stack.length;outBtn.hidden=!S.key}
backBtn.onclick=()=>{const prev=S.stack.pop();if(prev){m.replaceChildren(...prev)}backBtn.hidden=!S.stack.length};
outBtn.onclick=()=>{localStorage.removeItem('authKey');S.key='';S.stack=[];login()};

function login(msg=''){
  const em=h('input',{type:'email',placeholder:'Stremio email',autocomplete:'username'}),pw=h('input',{type:'password',placeholder:'Password',autocomplete:'current-password'});
  const er=h('div',{className:'err'},msg);
  const go=h('button',{className:'p',on:{click:async()=>{go.disabled=true;er.textContent='';
    try{const r=await api('login',{type:'Login',email:em.value.trim(),password:pw.value,facebook:false});
      S.key=r.authKey;localStorage.setItem('authKey',S.key);await home()}
    catch(e){er.textContent='Sign-in failed: '+(/fetch|network|load failed/i.test(e.message)?'couldn’t reach api.strem.io. This happens when the page is opened from a preview or a file instead of a real https:// address.':e.message);go.disabled=false}}}},'Sign in');
  show(h('div',{className:'form'},h('h2',{},'Sign in to Stremio'),em,pw,go,er,
    h('div',{className:'mute'},'Your password goes only to api.strem.io. Only the session key is saved on this device.')),{push:false});
  S.stack=[];backBtn.hidden=true;outBtn.hidden=true;
}

async function home(){
  show(h('p',{className:'mute'},'Loading your library…'),{push:false});S.stack=[];
  try{
    const [lib,ad]=await Promise.all([
      api('datastoreGet',{authKey:S.key,collection:'libraryItem',ids:[],all:true}),
      api('addonCollectionGet',{type:'AddonCollectionGet',authKey:S.key,update:true})]);
    S.lib=(lib||[]).filter(x=>!x.removed&&(x.type==='movie'||x.type==='series')).sort((a,b)=>(b._mtime||'').localeCompare(a._mtime||''));
    S.addons=(ad.addons||[]).filter(a=>(a.manifest.resources||[]).some(r=>(r.name||r)==='stream')).map(a=>({name:a.manifest.name,base:a.transportUrl.replace(/\/manifest\.json.*$/,'')}));
  }catch(e){if(/session|auth/i.test(e.message)){return login('Session expired. Sign in again.')}
    return show(h('p',{className:'err'},'Couldn’t load your library: '+e.message),{push:false})}
  const q=h('input',{type:'search',placeholder:'Filter your library'});
  const grid=h('div',{className:'grid'});
  const draw=()=>{grid.replaceChildren(...S.lib.filter(x=>x.name.toLowerCase().includes(q.value.toLowerCase())).map(it=>
    h('button',{className:'card',on:{click:()=>open(it)}},h('img',{src:it.poster||'',loading:'lazy',alt:''}),h('span',{},it.name))))};
  q.oninput=draw;draw();
  show([h('div',{className:'mute'},S.lib.length+' titles · '+S.addons.length+' stream addons'),q,grid],{push:false});
  backBtn.hidden=true;outBtn.hidden=false;
}

async function open(it){
  if(it.type==='movie')return streams(it.name,'movie',it._id);
  show(h('p',{className:'mute'},'Loading episodes…'));
  try{
    const meta=(await getJSON(`${CINE}/meta/series/${encodeURIComponent(it._id)}.json`)).meta;
    const vids=(meta.videos||[]).filter(v=>v.season>0);
    const seasons=[...new Set(vids.map(v=>v.season))].sort((a,b)=>a-b);
    const sel=h('select',{},seasons.map(s=>h('option',{value:s},'Season '+s)));
    const list=h('div',{className:'list'});
    const draw=()=>list.replaceChildren(...vids.filter(v=>v.season==sel.value).sort((a,b)=>a.episode-b.episode).map(v=>
      h('button',{className:'item',on:{click:()=>streams(`${it.name} S${v.season}E${v.episode}`,'series',v.id)}},`${v.episode}. ${v.title||v.name||'Episode '+v.episode}`)));
    sel.onchange=draw;draw();
    show([h('h2',{},it.name),sel,list],{push:false});S.stack.push([]);backBtn.hidden=false;
    backBtn.onclick=()=>home();
  }catch(e){show(h('p',{className:'err'},'Couldn’t load episodes: '+e.message))}
}

async function streams(title,type,id){
  const box=h('div',{className:'list'},h('p',{className:'mute'},'Asking '+S.addons.length+' addons…'));
  const stage=h('div');
  show([h('h2',{},title),stage,box]);
  backBtn.onclick=()=>home();
  let found=0,torrent=0;
  await Promise.allSettled(S.addons.map(async a=>{
    try{const r=await getJSON(`${a.base}/stream/${type}/${encodeURIComponent(id)}.json`);
      for(const s of r.streams||[]){
        const label=[s.name,s.title||s.description].filter(Boolean).join(' — ').replace(/\s*\n\s*/g,' · ');
        if(s.url&&/^https:/i.test(s.url)){found++;box.append(h('button',{className:'item',on:{click:()=>play(stage,s.url)}},a.name,h('small',{},label)))}
        else if(s.infoHash)torrent++;
      }}catch{}}));
  box.querySelector('p')?.remove();
  if(!found)box.append(h('p',{className:'mute'},torrent?`Only torrent streams found (${torrent}). Browsers can’t play torrents. Use an addon configured with a debrid service to get direct links.`:'No playable streams found.'));
}

function play(stage,url){
  const v=h('video',{controls:true,autoplay:true,playsInline:true,src:url});
  v.onerror=()=>{stage.append(h('p',{className:'err'},'This stream won’t play in the browser (format or codec). Try another one.'))};
  stage.replaceChildren(v);v.scrollIntoView({block:'center'});
}

S.key?home():login();
</script>
</body>
</html>
